spring.application.name=jwt-csrf-fileupload-demo

# The phrase JwtService hashes into the key it uses to sign and verify every token. In a
# real project this comes from an environment variable or a secrets manager, never from a
# file you commit to Git, anyone who has it can forge tokens.
app.jwt.secret=very_secret_phrase_dont_share
# How long a token (and therefore a login) stays valid before the user has to log in again.
app.jwt.expiration-minutes=60

# Where FileStorageService writes uploads, relative to wherever the application was started.
app.upload.dir=uploads

# Without these, Spring quietly rejects anything bigger than its own small default, which
# makes "my upload isn't working" a confusing first bug to run into.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
